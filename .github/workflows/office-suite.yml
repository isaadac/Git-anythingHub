# Builds Isadek Office installers for Windows, macOS and Linux.
# - Every push/PR touching office-suite/: runs tests and uploads installers as workflow artifacts.
# - Pushing a tag like "office-v1.0.0": also attaches the installers to a GitHub Release.
name: Isadek Office

on:
  push:
    paths: ['office-suite/**', '.github/workflows/office-suite.yml']
    tags: ['office-v*']
  pull_request:
    paths: ['office-suite/**', '.github/workflows/office-suite.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: office-suite

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: office-suite/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: office-suite/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Browser and tools for the end-to-end tests
        run: |
          npx playwright install --with-deps chromium
          pip install openpyxl python-pptx
      - name: End-to-end tests (web pages and the desktop app)
        run: xvfb-run -a npm run e2e

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: office-suite/package-lock.json
      - run: npm ci
      - name: Build installers
        shell: bash
        env:
          # Code signing is optional: add these repository secrets to sign (see office-suite/SIGNING.md).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args="${{ matrix.target }} --publish never"
          case "${{ runner.os }}" in
            Windows)
              if [ -n "$WIN_CSC_LINK" ]; then export CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"; signed=yes; fi ;;
            macOS)
              if [ -n "$MAC_CSC_LINK" ]; then export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"; signed=yes; fi
              if [ -n "$signed" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
                args="$args -c.mac.notarize=true"; echo "Notarizing with Apple"
              fi ;;
          esac
          unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD MAC_CSC_LINK MAC_CSC_KEY_PASSWORD
          if [ -z "$signed" ]; then
            echo "::notice::Building unsigned installers (no signing secrets for ${{ runner.os }})"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder $args
      - uses: actions/upload-artifact@v4
        with:
          name: isadek-office-${{ runner.os }}
          path: |
            office-suite/dist/*.exe
            office-suite/dist/*.dmg
            office-suite/dist/*.zip
            office-suite/dist/*.AppImage
            office-suite/dist/*.deb
            office-suite/dist/*.blockmap
            office-suite/dist/latest*.yml
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            office-suite/package-lock.json
            office-suite/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install the app's libraries
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Install Capacitor
        working-directory: office-suite/mobile
        run: npm ci
      - name: Build the web app and the Android project
        working-directory: office-suite/mobile
        run: npm run android
      - name: Build the APK
        working-directory: office-suite/mobile/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Isadek-Office-${GITHUB_SHA::7}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: isadek-office-android
          path: office-suite/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/office-v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
